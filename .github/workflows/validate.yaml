name: Validate ESPHome package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        esphome: ["2026.8.2", "2026.9.0", "2026.10.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "esphome==${{ matrix.esphome }}"
      - name: Validate configuration and advertising requests
        if: matrix.esphome != '2026.10.0'
        run: python tests/validate.py
      - name: Validate advertising requests and compile both boards
        if: matrix.esphome == '2026.10.0'
        run: python tests/validate.py --compile
